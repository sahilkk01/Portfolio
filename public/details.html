
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sahil Singh | Portfolio Details</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        body {
    background: rgb(20, 20, 58);
    color: whitesmoke;
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 100px 5% 40px;
}

.detail-nav {
    position: fixed;
    top: 0;
    left: 0;
    width: 90%;
    z-index: 1000;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgb(19, 19, 50);
    padding: 15px 5%;
    border-radius: 0;
}

        .detail-nav h3 {
            color: #d946ef;
        }

        .home-btn, .action-btn {
            display: inline-block;
            background: linear-gradient(90deg, #8b00ff, #ed4899);
            color: white;
            padding: 10px 18px;
            border-radius: 20px;
            text-decoration: none;
        }

        .content {
            max-width: 900px;
            margin: 30px auto;
        }

        .content h1 {
            color: #e879f9;
            margin-bottom: 15px;
        }

        .card {
            background: rgb(30, 30, 75);
            padding: 22px;
            border: 1px solid #7040a0;
            border-radius: 12px;
            margin: 18px 0;
            line-height: 1.7;
        }

        .card h2 {
            color: #e879f9;
            margin-bottom: 8px;
        }

        .project-name {
            display: block;
            color: #f0abfc;
            text-decoration: none;
            font-size: 20px;
            margin: 15px 0;
        }

        .project-name:hover {
            color: white;
        }
            .project-link {
            font-size: 22px;
            font-weight: bold;
            color: #b4abb6;
            text-decoration: none;
        }

        .project-link:hover {
            text-decoration: underline;
        }
        @media (max-width: 600px) {
            .detail-nav {
                padding: 12px 15px;
            }

            .content {
                margin-top: 20px;
            }
        }
        a{
            text-decoration: none;
        }
        a:hover{
            color:red;
            font-weight: bold;
        }
        
    .address-card {
        background-color: #131332;
        border: 1px solid blueviolet;
        border-radius: 12px;
        padding: 20px;
        margin: 20px 0;
        color: whitesmoke;
    }

    .address-card h2 {
        color: #d946ef;
        margin-bottom: 15px;
    }

    .address-card p {
        margin: 10px 0;
    }
    


.certificate-container {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 25px;
    margin-top: 30px;
}

.certificate-link {
    display: block;
    text-decoration: none;
    color: inherit;
    min-width: 0;
}

.certificate-card {
    height: 100%;
    box-sizing: border-box;
    background: #131332;
    border: 1px solid blueviolet;
    border-radius: 12px;
    padding: 18px;
    text-align: center;
    min-width: 0;
    transition: transform 0.3s ease, border-color 0.3s ease;
    cursor: pointer;
}

.certificate-card:hover {
    transform: translateY(-5px);
    border-color: #d946ef;
}

.certificate-card h2 {
    color: #d946ef;
    margin-bottom: 15px;
}

.certificate-card p {
    color: whitesmoke;
    margin-bottom: 0;
}
.certificate-img {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 6px;
    user-select: none;
    -webkit-user-drag: none;
}

.certificate-card iframe {
    width: 100%;
    height: 300px;
    border: none;
    border-radius: 6px;
}

/* Mobile responsive */
@media (max-width: 600px) {
    .certificate-container {
        grid-template-columns: 1fr;
    }
}


    </style>
</head>

<body>

    <nav class="detail-nav">
        <h3>Sahil Singh</h3>
        <a href="../index.html" class="home-btn">← Home</a>
    </nav>

    <main class="content" id="content">
        <h1>Loading...</h1>
    </main>

    <script src="../src/details.js"></script>
</body>
</html>
